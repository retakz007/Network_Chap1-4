function grade(s){const chapters=CHAPTERS.map((name,i)=>({name,total:20,correct:QUESTIONS.filter(q=>q.chapter===i+1&&s.answers[q.id]===q.answer).length,answered:QUESTIONS.filter(q=>q.chapter===i+1&&s.answers[q.id]!==undefined).length}));return {score:chapters.reduce((n,c)=>n+c.correct,0),chapters,missed:QUESTIONS.filter(q=>s.answers[q.id]!==q.answer)};}
function announce(t){document.getElementById('announcement').textContent=t;}
function render(focus=false){document.getElementById('restartTop').hidden=!state;app.innerHTML=screen==='home'?home():screen==='quiz'?quiz():results();bind();if(focus){const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}}
function home(){return `<section class="hero"><div><span class="eyebrow">YOUR NETWORK KNOWLEDGE, CONNECTED.</span><h1>Small questions.<br>Stronger connections.</h1><p>Master all four chapters with a focused, 80-question quiz. Take your time, test what you know, and learn from every mistake.</p><div class="hero-actions">${state&&!state.finished?`<button class="primary" data-action="resume">Continue attempt <span>→</span></button><button class="secondary" data-action="new">Start fresh</button>`:`<button class="primary" data-action="new">Start the 80-question quiz <span>→</span></button>${state?'<button class="secondary" data-action="results">Last results</button>':''}`}</div><div class="hero-note">${state&&!state.finished?`${countAnswered()} of 80 answered · Your place is saved.`:'No timer. One point per question. A fresh order every attempt.'}</div></div><div class="visual" aria-label="80 questions across 4 chapters"><div class="visual-label"><span>THE FULL PICTURE</span><span>01 / 04</span></div><div class="number">80<span>questions</span></div><div class="visual-bottom" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p>4 chapters · 20 questions each<br>One step closer to mastery.</p></div></section><div class="section-line"><strong class="eyebrow">WHAT YOU’LL PRACTICE</strong><span>Your course, chapter by chapter.</span></div><section class="chapters">${CHAPTERS.map((n,i)=>`<article class="chapter-tile"><span class="idx">0${i+1} /</span><h3>${n}</h3><p>${DESCRIPTIONS[i]}</p><small>20 QUESTIONS</small></article>`).join('')}</section>`;}
function quiz(){const q=byId[state.order[state.current]],answered=countAnswered(),flagged=state.flags.includes(q.id);return `<div class="workspace"><aside class="sidebar"><span class="eyebrow">YOUR STUDY SESSION</span><h3>Four chapters. One goal.</h3>${CHAPTERS.map((n,i)=>{const count=QUESTIONS.filter(q=>q.chapter===i+1&&state.answers[q.id]!==undefined).length;return `<div class="chapter-progress"><div class="row"><span>0${i+1} ${n}</span><span>${count}/20</span></div><div class="bar"><i style="width:${count*5}%"></i></div></div>`;}).join('')}<details class="navigator" open><summary>Question navigator</summary><div class="grid">${state.order.map((id,i)=>`<button data-jump="${i}" class="${state.answers[id]!==undefined?'answered ':''}${i===state.current?'current ':''}${state.flags.includes(id)?'flag':''}" aria-label="Question ${i+1}${state.answers[id]!==undefined?', answered':', unanswered'}${state.flags.includes(id)?', flagged':''}" ${i===state.current?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="legend">Green = answered · Orange dot = flagged<br>Select any number to revisit.</p></details></aside><section><div class="quiz-head"><div><span class="eyebrow">PRACTICE / FULL COURSE</span><h1>Make the connection.</h1></div><span class="counter">${answered} / 80 answered</span></div><div class="progress" role="progressbar" aria-label="Questions answered" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="80"><i style="width:${answered/80*100}%"></i></div><article class="question-card"><div class="question-meta"><span class="pill">CH ${q.chapter} · ${CHAPTERS[q.chapter-1]}</span><button class="flag-button ${flagged?'active':''}" data-action="flag" aria-pressed="${flagged}">${flagged?'⚑ Flagged':'⚐ Flag for review'}</button></div><span class="eyebrow">QUESTION ${String(state.current+1).padStart(2,'0')} / 80</span><h2 id="questionText" style="margin-top:12px">${esc(q.q)}</h2><div class="options" role="radiogroup" aria-labelledby="questionText">${state.choices[q.id].map((o,i)=>`<label class="option ${state.answers[q.id]===o?'selected':''}"><input type="radio" name="answer" value="${o}" ${state.answers[q.id]===o?'checked':''}><span class="letter" aria-hidden="true">${'ABCD'[i]}</span><span class="option-text">${esc(q.options[o])}</span></label>`).join('')}</div></article><div class="quiz-bottom"><button class="secondary" data-action="previous" ${state.current===0?'disabled':''}>← Previous</button><div class="right"><button class="secondary" data-action="finish">Finish quiz</button>${state.current<79?'<button class="primary" data-action="next">Next <span>→</span></button>':''}</div></div><p class="sub-note">Choose one answer. You can change it anytime before finishing.</p></section></div>`;}
function results(){const g=grade(state),pct=Math.round(g.score/80*100);const visible=state.order.map(id=>byId[id]).filter(q=>filter==='all'||(filter==='mistakes'?state.answers[q.id]!==q.answer:q.chapter===Number(filter)));return `<div class="result-heading"><div><span class="eyebrow">ATTEMPT COMPLETE / YOUR RESULTS</span><h1>${g.score===80?'Every connection made.':g.score>=64?'Your knowledge is connecting.':'Every attempt builds understanding.'}</h1><p>${g.score===80?'Perfect score. Try a new order to reinforce what you know.':'Review the explanations below, then try a fresh shuffle.'}</p></div><button class="primary" data-action="new">Restart & shuffle ↻</button></div><section class="score-layout"><div class="score-card"><span class="eyebrow">YOUR TOTAL SCORE</span><div class="score-num">${g.score}<span> / 80</span></div><p>${pct}% correct · ${countAnswered()} answered · ${80-countAnswered()} unanswered</p></div><div class="breakdown"><span class="eyebrow" style="display:block;margin-bottom:18px">CHAPTER BREAKDOWN</span>${g.chapters.map((c,i)=>`<div class="chapter-progress"><div class="row"><span>0${i+1} ${c.name}</span><strong>${c.correct} / 20</strong></div><div class="bar"><i style="width:${c.correct*5}%"></i></div></div>`).join('')}</div></section><div class="section-line"><h2 style="font-size:23px;margin:0">Your answer review</h2><span>${g.missed.length} to revisit · No negative marking</span></div><div class="review-controls" role="group" aria-label="Filter answer review">${[['mistakes',`Mistakes (${g.missed.length})`],['all','All answers'],...CHAPTERS.map((n,i)=>[String(i+1),`Chapter ${i+1}`])].map(([v,l])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><div id="reviewList">${visible.length?visible.map(q=>review(q)).join(''):'<div class="empty">No mistakes. You answered all 80 questions correctly!</div>'}</div>`;}
function review(q){const a=state.answers[q.id],correct=a===q.answer,pos=state.order.indexOf(q.id)+1;return `<details class="review-item ${correct?'correct':''}" ${filter==='mistakes'?'open':''}><summary><span class="status-dot" aria-hidden="true">${correct?'✓':'×'}</span><span class="review-title">${esc(q.q)}<small>Question ${pos} · Chapter ${q.chapter} · ${correct?'Correct':a===undefined?'Unanswered':'Incorrect'}</small></span><span class="review-toggle" aria-hidden="true">⌄</span></summary><div class="review-body"><div class="answer-line ${correct?'correct-text':'wrong-text'}"><b>Your answer:</b> ${a===undefined?'Not answered':esc(q.options[a])}</div>${!correct?`<div class="answer-line correct-text"><b>Correct answer:</b> ${esc(q.options[q.answer])}</div>`:''}<div class="explanation"><b>Why this is correct</b><br>${esc(q.explanation)}</div></div></details>`;}
async function confirmAction(title,body,label){const d=document.getElementById('confirm');document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').textContent=body;document.getElementById('dialogOK').textContent=label;d.returnValue='';d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>resolve(d.returnValue==='ok'),{once:true}));}
async function start(){if(state&&!state.finished&&!await confirmAction('Start a fresh attempt?',`Your current ${countAnswered()} answers will be cleared. All 80 questions and their answer choices will be shuffled.`,'Restart & shuffle'))return;state=fresh(state?.order);screen='quiz';filter='mistakes';save();render(true);announce('New shuffled attempt started.');}
async function finish(){const n=80-countAnswered();if(!await confirmAction(n?`${n} question${n===1?' is':'s are'} unanswered`:'Ready to see your score?',n?'Unanswered questions receive zero points. You can return to them now, or finish and review your results.':'Your answers will be marked, and you can review explanations for every question.','Finish & see score'))return;state.finished=true;screen='results';filter='mistakes';save();render(true);announce(`Quiz complete. Your score is ${grade(state).score} out of 80.`);}
function bind(){app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.current=Number(b.dataset.jump);save();render(true);});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();app.querySelector(`[data-filter="${filter}"]`).focus();});app.querySelectorAll('input[name="answer"]').forEach(input=>input.onchange=()=>{state.answers[state.order[state.current]]=Number(input.value);save();const value=input.value;render();app.querySelector(`input[value="${value}"]`).focus({preventScroll:true});announce(`Answer saved. ${countAnswered()} of 80 answered.`);});}
function action(a){if(a==='new')start();if(a==='resume'){screen='quiz';render(true);}if(a==='results'){screen='results';render(true);}if(a==='next'||a==='previous'){state.current=Math.max(0,Math.min(79,state.current+(a==='next'?1:-1)));save();render(true);}if(a==='flag'){const id=state.order[state.current];state.flags=state.flags.includes(id)?state.flags.filter(x=>x!==id):[...state.flags,id];save();render();app.querySelector('[data-action="flag"]').focus();}if(a==='finish')finish();}
document.getElementById('restartTop').onclick=start;
document.getElementById('brand').onclick=e=>{e.preventDefault();screen='home';render(true);};
render();
</script></body></html>
